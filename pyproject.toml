[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-inference-framework"
version = "0.1.0"
description = "Framework de benchmarking e inferencia para estrategias multi-etapa sobre Gemini."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Damian Sire", email = "damiansire@gmail.com" }]
keywords = ["gemini", "llm", "inference", "benchmarking"]
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

# Herramientas de desarrollo/CI: pytest para la suite, ruff para lint+format.
# Se instalan con `pip install -e .[dev]` (lo que corre el gate de CI).
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[project.urls]
Repository = "https://github.com/damiansire/gemini-inference-framework"
Homepage = "https://github.com/damiansire/gemini-inference-framework"

# Layout: `prompts.py` en la raiz (los runners lo importan como modulo
# top-level) + tres paquetes: `strategies` (el framework), `scripts` (el
# orquestador y utilidades operativas, se corren con `python -m scripts.X`) y
# `benchmarks` (harness de replay deterministico). La autodeteccion de
# setuptools falla porque `dashboard/` y `benchmark_results/` son directorios
# hermanos que NO son codigo Python; por eso se declara explicito.
[tool.setuptools]
py-modules = ["prompts"]

[tool.setuptools.packages.find]
include = ["strategies*", "scripts*", "benchmarks*"]

[tool.pytest.ini_options]
# Orden aleatorio fuerza independencia entre tests; los timeouts se arreglan
# arreglando el test lento, nunca subiendo el limite.
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Bugbear (B), comprehensions (C4), pycodestyle (E/W), pyflakes (F),
# flake8-bandit (S, seguridad: relevante por las API keys de Gemini),
# isort (I), simplify (SIM), pyupgrade (UP).
extend-select = ["B", "C4", "E", "F", "S", "I", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
# En tests se permiten asserts (S101) y datos "hardcodeados" de fixtures.
"tests/**" = ["S101", "S105", "S106"]
# prompts.py es texto de prompts en lenguaje natural: el contenido (incluido
# el whitespace dentro de los string literals) debe quedar verbatim. Partir
# lineas largas (E501) o recortar espacios (W291/W293) cambiaria el prompt que
# se le manda al modelo, asi que se ignoran solo en este archivo.
"prompts.py" = ["E501", "W291", "W293"]
